# Regresión de todas las prácticas publicadas en cada push: un cambio del
# motor que rompa una práctica ya usada se detecta antes de llegar al alumnado.
name: Regresión

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regresion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar puppeteer-core
        run: npm install --no-save --no-package-lock puppeteer-core@25.16.0
      - name: Probar las prácticas en Chrome sin interfaz
        env:
          CHROME: /usr/bin/google-chrome
        run: node pruebas/regresion.js
